<!-- Error Handling / Exception Handling -->
<button onclick="test()">Run Try-Catch</button>
<script>
function test() {
    console.log("Test function is called.")
    try {
        console.log("Trying...");
        shubhashreeFunction(); // Throws ReferenceError
    } catch (e) {
        console.error("Caught error:", e.message);
    } finally {
        console.log("Finally always runs.");
    }
}
</script>
